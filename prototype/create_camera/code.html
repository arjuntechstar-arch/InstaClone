  // Camera trigger & tactile interaction script
  document.getElementById('shutterBtn')?.addEventListener('click', function() {
    const core = this.querySelector('.bg-primary');
    if (core) {
      core.classList.add('scale-75', 'bg-secondary');
      setTimeout(() => {
        core.classList.remove('scale-75', 'bg-secondary');
      }, 200);
    }
  });

  document.getElementById('flipBtn')?.addEventListener('click', function() {
    this.classList.toggle('rotate-180');
  });
