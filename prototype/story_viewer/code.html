  </head><body class="bg-background font-body text-on-surface flex flex-col min-h-screen"><main class="flex flex-col relative w-full min-h-screen pt-safe pb-safe bg-background"><div class="flex flex-col w-full relative select-none overflow-hidden" id="story-viewport" style="height: 100dvh; max-height: 100dvh;">

<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">location_on</span>
<span class="font-label text-xs tracking-wider font-semibold">NEO-SHINJUKU SEC_04</span>
</div>
<!-- Mention Sticker -->
<div class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-surface/70 backdrop-blur-xl text-on-surface shadow-[0_0_12px_rgba(255,45,120,0.2)] hover:bg-surface-variant transition-colors cursor-pointer">
<span class="text-primary font-bold text-xs">@</span>

</div>
</div>
<!-- Interactive Poll Sticker: Cyber Mod of the Week -->
<div class="w-full rounded-2xl bg-surface/85 backdrop-blur-2xl p-4 shadow-[0_8px_32px_rgba(0,0,0,0.7)] pointer-events-auto flex flex-col gap-3">
<!-- Poll Question Header -->
<div class="flex items-start gap-2.5">
<div class="w-7 h-7 rounded-lg bg-primary/20 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary text-base">how_to_vote</span>
</div>
<div class="flex flex-col">
<span class="font-label text-[10px] text-tertiary tracking-widest uppercase font-bold">NEURAL POLL • VOTE NOW</span>
<h2 class="font-headline font-bold text-sm text-on-surface leading-tight mt-0.5">
            CYBER MOD OF THE WEEK: Neural Visor vs Plasma Katana?
          </h2>
</div>
</div>
<!-- Options Container -->
<div class="flex flex-col gap-2.5" id="poll-options">
<!-- Option A: Neural Visor -->
<button class="relative w-full h-11 rounded-xl bg-surface-container-high overflow-hidden text-left flex items-center justify-between px-3 transition-transform active:scale-[0.99] group" id="poll-opt-a">
<!-- Animated Progress Fill (Cyan) -->
<div class="absolute left-0 top-0 bottom-0 bg-secondary/25 transition-all duration-700 ease-out" id="fill-a" style="width: 68%;"></div>
<div class="relative z-10 flex items-center gap-2">
<span class="text-base">🥽</span>
<span class="font-headline font-semibold text-xs text-on-surface group-hover:text-secondary transition-colors">Neural Visor</span>
</div>

</button>
<!-- Option B: Plasma Katana -->
<button class="relative w-full h-11 rounded-xl bg-surface-container-high overflow-hidden text-left flex items-center justify-between px-3 transition-transform active:scale-[0.99] group" id="poll-opt-b">
<!-- Animated Progress Fill (Magenta) -->
<div class="absolute left-0 top-0 bottom-0 bg-primary/25 transition-all duration-700 ease-out" id="fill-b" style="width: 32%;"></div>
<div class="relative z-10 flex items-center gap-2">
<span class="text-base">⚔️</span>
<span class="font-headline font-semibold text-xs text-on-surface group-hover:text-primary transition-colors">Plasma Katana</span>
</div>

</button>
</div>
<!-- Live Participant Counter -->
<div class="flex items-center justify-between pt-0.5 text-[11px] font-label text-on-surface-variant">
<span class="flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-secondary animate-ping"></span>
          14,892 cyborgs voted
        </span>
<span class="text-tertiary font-semibold tracking-wider text-[10px] uppercase">Ends in 20h</span>
</div>
</div>
</div>
<!-- BOTTOM BAR: Ephemeral Transmission & Quick Reactions -->
<div class="relative z-30 px-4 pb-5 flex items-center gap-2 bg-gradient-to-t from-background via-background/90 to-transparent pt-3">
<!-- Ephemeral Message Input Field -->
<div class="relative flex-1 flex items-center">
<input class="w-full h-11 pl-4 pr-10 rounded-full bg-surface/75 backdrop-blur-xl text-xs font-body text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:bg-surface-variant/90 transition-all shadow-inner shadow-black/40" id="reply-input" placeholder="Transmit ephemeral reply..." type="text"/>
<!-- Send Trigger inside input -->
<button class="absolute right-1.5 w-8 h-8 rounded-full flex items-center justify-center text-on-surface-variant hover:text-secondary active:scale-90 transition-all" id="send-btn">
<span class="material-symbols-outlined text-base">send</span>
</button>
</div>
<!-- Quick Heart Burst Button -->
<button aria-label="Heart Reaction" class="relative w-11 h-11 rounded-full bg-surface/75 backdrop-blur-xl flex items-center justify-center text-on-surface hover:text-primary transition-all active:scale-75 shadow-lg" id="heart-btn">
<span class="material-symbols-outlined text-xl transition-all" id="heart-icon">favorite</span>
<div class="absolute inset-0 pointer-events-none" id="heart-burst-anchor"></div>
</button>
<!-- Share/DM Icon -->
<button aria-label="Share Story" class="w-11 h-11 rounded-full bg-surface/75 backdrop-blur-xl flex items-center justify-center text-on-surface hover:text-secondary transition-all active:scale-90">
<span class="material-symbols-outlined text-xl">near_me</span>
</button>
<!-- Story Overflow Menu -->
<button aria-label="More Options" class="w-9 h-9 rounded-full bg-surface/50 backdrop-blur-md flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-all active:scale-90">
<span class="material-symbols-outlined text-base">more_vert</span>
</button>
</div>
<!-- Toast Feed for Replies -->
<div class="absolute top-20 left-1/2 -translate-x-1/2 z-40 bg-surface/95 backdrop-blur-xl text-secondary px-4 py-1.5 rounded-full text-xs font-label opacity-0 pointer-events-none transition-all duration-300 shadow-[0_0_15px_rgba(0,255,204,0.3)]" id="toast-msg">
    TRANSMISSION SENT // ENCRYPTED
  </div>
</div>
<script>
  (function () {
    // Interactive State Variables
    let isPaused = false;
    let isMuted = false;
    let hasVoted = false;
    let progressVal = 60;

    const pauseBtn = document.getElementById('toggle-pause-btn');
    const pauseIcon = document.getElementById('pause-icon');
    const muteBtn = document.getElementById('toggle-mute-btn');
    const soundIcon = document.getElementById('sound-icon');
    const progressBar = document.getElementById('story-progress');
    const heartBtn = document.getElementById('heart-btn');
    const heartIcon = document.getElementById('heart-icon');
    const heartAnchor = document.getElementById('heart-burst-anchor');
    const replyInput = document.getElementById('reply-input');
    const sendBtn = document.getElementById('send-btn');
    const toast = document.getElementById('toast-msg');

    // Poll Elements
    const optA = document.getElementById('poll-opt-a');
    const optB = document.getElementById('poll-opt-b');
    const fillA = document.getElementById('fill-a');
    const fillB = document.getElementById('fill-b');
    const percA = document.getElementById('percent-a');
    const percB = document.getElementById('percent-b');

    // Toggle Pause/Play
    if (pauseBtn && pauseIcon) {
      pauseBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        isPaused = !isPaused;
        pauseIcon.textContent = isPaused ? 'play_arrow' : 'pause';
      });
    }

    // Toggle Mute/Sound
    if (muteBtn && soundIcon) {
      muteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        isMuted = !isMuted;
        soundIcon.textContent = isMuted ? 'volume_off' : 'volume_up';
        soundIcon.classList.toggle('text-error', isMuted);
      });
    }

    // Simulate story ticker
    setInterval(() => {
      if (!isPaused && progressBar) {
        progressVal += 0.8;
        if (progressVal > 100) progressVal = 0;
        progressBar.style.width = progressVal + '%';
      }
    }, 100);

    // Heart Burst Reaction
    if (heartBtn) {
      heartBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        heartIcon.style.fontVariationSettings = "'FILL' 1";
        heartIcon.classList.add('text-primary');

        // Create particles
        for (let i = 0; i < 7; i++) {
          const p = document.createElement('span');
          p.className = 'absolute material-symbols-outlined text-xs text-primary pointer-events-none transition-all duration-700 ease-out';
          p.textContent = 'favorite';
          p.style.fontVariationSettings = "'FILL' 1";
          p.style.left = '16px';
          p.style.top = '12px';
          
          heartAnchor.appendChild(p);

          const angle = (Math.PI * 2 * i) / 7;
          const dist = 32 + Math.random() * 24;
          const x = Math.cos(angle) * dist;
          const y = Math.sin(angle) * dist - 20;

          requestAnimationFrame(() => {
            p.style.transform = `translate(${x}px, ${y}px) scale(${0.5 + Math.random() * 0.8})`;
            p.style.opacity = '0';
          });

          setTimeout(() => p.remove(), 750);
        }
      });
    }

    // Poll Selection Micro-interaction
    function handleVote(choice) {
      if (hasVoted) return;
      hasVoted = true;

      if (choice === 'a') {
        fillA.style.width = '69%';
        fillB.style.width = '31%';
        percA.textContent = '69%';
        percB.textContent = '31%';
        optA.classList.add('shadow-[0_0_15px_rgba(0,255,204,0.4)]');
      } else {
        fillA.style.width = '67%';
        fillB.style.width = '33%';
        percA.textContent = '67%';
        percB.textContent = '33%';
        optB.classList.add('shadow-[0_0_15px_rgba(255,45,120,0.4)]');
      }
    }

    if (optA && optB) {
      optA.addEventListener('click', (e) => {
        e.stopPropagation();
        handleVote('a');
      });
      optB.addEventListener('click', (e) => {
        e.stopPropagation();
        handleVote('b');
      });
    }

    // Ephemeral Message Transmission
    function sendReply() {
      if (!replyInput.value.trim()) return;
      replyInput.value = '';
      if (toast) {
        toast.classList.remove('opacity-0', 'pointer-events-none');
        toast.classList.add('opacity-100');
        setTimeout(() => {
          toast.classList.add('opacity-0', 'pointer-events-none');
          toast.classList.remove('opacity-100');
        }, 2200);
      }
    }

    if (sendBtn) {
      sendBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        sendReply();
      });
    }

    if (replyInput) {
      replyInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          sendReply();
        }
      });
    }

    // Story Segment Taps
    const tapPrev = document.getElementById('tap-prev');
    const tapNext = document.getElementById('tap-next');
    if (tapPrev) {
      tapPrev.addEventListener('click', () => {
        progressVal = 0;
        if (progressBar) progressBar.style.width = '0%';
      });
    }
    if (tapNext) {
      tapNext.addEventListener('click', () => {
        progressVal = 100;
        if (progressBar) progressBar.style.width = '100%';
      });
    }
  })();
</script></main></body></html>
